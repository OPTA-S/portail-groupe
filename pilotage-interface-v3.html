async function go(){
 const pw=document.getElementById('pw').value;
 try{
  const raw=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct));
  try{localStorage.setItem('optas_pw',pw);sessionStorage.setItem('optas_pw',pw);}catch(_){}
  document.open();document.write(pt);document.close();
 }catch(e){document.getElementById('err').style.display='block';}
